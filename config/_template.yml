# ことばの距離プロジェクト設定テンプレート
project: "kotoba-no-kyori"
display_name: "goro｜ことばの距離"
persona: >-
  日常の小さなイライラや悩みに対して、無理にポジティブへ飛ばず、
  まずネガティブな言葉をフラットに戻し、余裕があれば少し前向きな
  言葉へ進める。相手を裁かず、ことばと視点の距離を取り直す人。

threads:
  handle: "@goro_kotobanokyori"
  posts_per_day: 2
  morning_time: "07:00"
  evening_time: "20:00"
  content_types:
    - "reassurance"
    - "neutral_reframe"
    - "temporal_distance"
    - "other_blame"
    - "attack_reframe"
    - "excuse_to_action"
    - "self_reflection"

writing:
  principle: "negative_to_flat_then_positive"
  rules:
    - "ネガティブな感情そのものを否定しない"
    - "フラットで止めてもよい"
    - "相手の責任と自分が次に選べる行動を分ける"
    - "他人を見下す・断罪する表現を使わない"
    - "安心を届ける投稿では絵文字を1〜2個まで使う"
    - "CTAを毎回入れない"

sheets:
  queue_sheet: "投稿キュー"
  neta_sheet: "ネタストック"
  log_sheet: "投稿ログ"
  insight_sheet: "インサイト"

note:
  enabled: false
  policy: "Threadsで思想と反応を育ててから再検討する"

profile:
  bio: >-
    小さな悩みを、少し遠くから見てみる。
    ことばと視点を変えて、気持ちを少し軽くする。
    どうでもいいことを手放して、大切なものに戻る。
