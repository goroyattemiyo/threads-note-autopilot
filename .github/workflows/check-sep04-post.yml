name: Check Sep04 Threads Post

on:
  push:
    paths:
      - '.github/workflows/check-sep04-post.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check published media and account
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ['THREADS_ACCESS_TOKEN']
          user_id = os.environ['THREADS_USER_ID']
          post_id = '18103368314213535'
          def get(path, fields):
              q = urllib.parse.urlencode({'fields': fields, 'access_token': token})
              with urllib.request.urlopen(f'https://graph.threads.net/v1.0/{path}?{q}', timeout=30) as r:
                  return json.loads(r.read().decode())
          out = {}
          for key, path, fields in [
              ('account', user_id, 'id,username'),
              ('post', post_id, 'id,username,permalink,text,timestamp'),
          ]:
              try:
                  out[key] = get(path, fields)
              except Exception as e:
                  out[key] = {'error': str(e)}
          os.makedirs('data', exist_ok=True)
          with open('data/check-sep04-post.status','w',encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PY
      - name: Record status
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/check-sep04-post.status
          git commit -m 'chore: record Sep04 Threads post check [skip ci]' || true
          git push
