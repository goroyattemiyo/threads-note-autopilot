name: Unit Tests
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests

  import-kotoba-week:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: project-23377501-df9e-4686-987
      GCP_WIF_PROVIDER: projects/879005049988/locations/global/workloadIdentityPools/github-actions/providers/github-actions
      GCP_SERVICE_ACCOUNT: kotoba-no-kyori-sheets@project-23377501-df9e-4686-987.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - name: Skip if already imported
        id: imported
        run: |
          if [ -f data/import-kotoba-week-20260810.status ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.imported.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        if: steps.imported.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        if: steps.imported.outputs.skip != 'true'
      - name: Import posts and ideas
        if: steps.imported.outputs.skip != 'true'
        run: python scripts/import_kotoba_week_20260810.py
      - name: Record successful import
        if: steps.imported.outputs.skip != 'true'
        run: |
          mkdir -p data
          printf 'success\nspreadsheet_id=1vmzjImuoZfm81JQClAMAmsqsaDPx7YuUAhZofrXQRWE\nqueue=14\nstock=14\n' > data/import-kotoba-week-20260810.status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/import-kotoba-week-20260810.status
          git commit -m 'chore: confirm kotoba week sheet import [skip ci]'
          git push
